[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse"
version = "0.1.0"
description = "ควบคุมเมาส์และสลับโปรแกรมด้วยมือผ่านเว็บแคม (Windows 10/11)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python",
    "PySide6",
    "tomli-w",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
