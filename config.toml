[camera]
index = 0
width = 640
height = 480
mirror = true
hand = "left"             # "right" | "left"

[motion]
mode = "relative"         # "relative" | "absolute"
sensitivity = 1.0
deadzone = 0.065          # รัศมี "สายจูง" (หน่วยขนาดมือ): มือขยับในรัศมีนี้ cursor นิ่ง
accel_low_gain = 0.4
accel_high_gain = 2.5
edge_overshoot = 0.05
click_rollback_ms = 300     # ย้อนตำแหน่งคลิกได้สูงสุดเท่านี้ (คลิกยืนยัน + หน่วงกันกำมือ ~0.3 s ที่ 10 fps)
min_cutoff = 1.0
beta = 0.007
scroll_speed = 2400.0     # scroll จอยสติ๊ก: wheel/s ต่อระยะ 1 ขนาดมือจากจุดเริ่ม (120 = 1 notch)

[gesture]
curl_down = 0.70          # กำมือ (clutch): ทุกนิ้วต่ำกว่านี้; นิ้วปกติ 0.88–0.98
curl_up = 0.82            # ออกจาก clutch / นิ้วถือว่าเหยียด
click_curl_down = 0.77    # คลิก: พับนิ้วชี้ (ซ้าย) / นิ้วกลาง (ขวา) ต่ำกว่านี้
click_curl_up = 0.84      # คลิก: ต้องเหยียดเกินนี้ก่อนคลิกครั้งถัดไป
pinch_down = 0.022        # เมตร: จีบ (ลาก) เมื่อโป้ง–ชี้ใกล้กว่านี้ (median 5 เฟรม; จีบจริง 0.6–2.4 cm)
pinch_up = 0.033          # เมตร: ปล่อยจีบ (เลิกลาก) เมื่อห่างกว่านี้; ท่าพัก 2.5–8 cm
confirm_frames = 2
toggle_hold_ms = 700      # พลิกมือค้างเท่านี้เพื่อเปิด/ปิด
switcher_hold_ms = 300    # ค้างท่า 3 นิ้ว (ชี้+กลาง+นาง เหยียด ก้อยพับ) เท่านี้เพื่อเปิดตัวสลับหน้าต่าง
switcher_step = 0.4       # ระยะเลื่อนต่อการ์ด (หน่วยขนาดมือ); ช่วงมือซ้าย-ขวาสบาย ~2.0 → 0.6 ถึงแค่การ์ด 3-4 (log 20261027-202631)
switcher_gap_on = 0.15    # เข้าท่า: gap = min(ชี้,กลาง,นาง) - ก้อย; ท่าจริง median +0.20 (p10 0.10), มือปกติ p99 +0.07 และนาน <= 0.13 s
switcher_gap_hold = 0.08  # ค้างท่า: gap เกินนี้ถือว่ายังอยู่ในท่า (ท่าจริง p5 0.076)
switcher_pinky_open = 0.88  # ก้อยเหยียดเกินนี้ (ท่าจริง p90 0.85, มือปกติ p1 0.84) + gap < 0.06 = เลิกท่า (commit)
switcher_swipe_speed = 6.0  # สะบัดขึ้น/ลง |vy| (hand-size/s): สะบัดจริง 6.4-9.3, ขยับซ้าย-ขวา peak 5.1, นิ่ง 1.85
min_presence = 0.6
flip_facing_min = 0.5     # พลิกมือ: |facing| ต้องเกินนี้
normal_facing = -1        # ด้านปกติของมือ (ค่า facing ตอนขยับปกติ): -1 / 1 หรือ 0 = เรียนรู้เอง
scroll_curl_max = 0.78    # scroll: ค่าเฉลี่ย curl นิ้วนาง+ก้อยต้องต่ำกว่านี้
scroll_extend_min = 0.75  # scroll: นิ้วชี้และนิ้วกลางต้องเหยียดเกินนี้

[app]
auto_exit_minutes = 10    # มือหายครบเท่านี้ (นาที) → ปิดโปรแกรมเอง; 0 = ไม่ปิด (หรือรันด้วย --stay)
low_power_after_s = 3     # มือหายเกินนี้ (วินาที) → ประหยัดพลังงาน + ปิดการควบคุม
low_power_fps = 6         # อัตรา inference ช่วงประหยัดพลังงาน
sounds = true             # เสียงตอนคลิก/ลาก/เปิดปิด
overlay = true            # วงสถานะตาม cursor

[snap]
enabled = true            # cursor เกาะปุ่มอัตโนมัติ (แม่เหล็ก + หนืด) ปิดได้จากเมนู tray
capture_px = 24.0         # ขยายกรอบปุ่มออกเท่านี้ (px) = ระยะที่เริ่มเกาะ
search_px = 48.0          # รัศมีจุดค้นหาปุ่มรอบ cursor (px)
friction = 0.35           # บนปุ่ม การขยับเหลือสัดส่วนนี้ (ยิ่งน้อยยิ่งหนืด)
pull_time_s = 0.12        # เวลาดูดเข้ากลางปุ่ม (วินาที)
slow_speed = 0.5          # มือช้ากว่านี้ (ขนาดมือ/วิ) จึงดูดเข้ากลาง (log 20261027: ก่อนคลิกมือ <= 0.45)
escape_speed = 1.2        # มือเร็วกว่านี้ไม่หนืด (log 20261027: p90 ตอน move = 1.42; 2.0 หนืดเกือบตลอด)
uia = true                # หาปุ่มในโปรแกรมด้วย UI Automation

[switcher]
enabled = true            # ท่า 3 นิ้วเปิดตัวสลับหน้าต่าง
preview = true            # แสดงภาพตัวอย่างหน้าต่างในการ์ด

[meta]
calibrated = ""           # เวลาที่ calibrate ล่าสุด (โปรแกรมเขียนให้เอง) ว่าง = ยังไม่เคย calibrate
